[package]
name = "vostok-gameboy"
version = "0.2.0"
edition = "2021"
authors = ["Troy Havelin", "Dillon Quigley <dillonmquigley@gmail.com>"]
description = "Vostok Gameboy: a terminal Game Boy / Game Boy Color player in the Vostok TUI style"
license = "MIT"
repository = "https://github.com/thavelin/vostok-gameboy"
readme = "README.md"
publish = false

[lib]
name = "vostok_gameboy"
path = "src/lib.rs"

[[bin]]
name = "vostok-gameboy"
path = "src/main.rs"

[dependencies]
# The emulator core (CPU, picture, sound, mappers), kept in this repo so it can
# be changed: see core/README.md. Everything else here wraps it.
gameboy_core = { path = "core" }
crossterm = "0.29"
rodio = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
# ROMs are usually kept zipped; only deflate is needed.
zip = { version = "9", default-features = false, features = ["deflate"] }
crc32fast = "1"
# Screenshots from `ctl run --shot`.
png = "0.18"
# The terminal UI (src/tui): the same stack as the other Vostok Rust apps.
ratatui = "0.30"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No `panic = "abort"`: the session thread catches a core panic and reports it
# instead of killing the terminal while it is in raw mode.
